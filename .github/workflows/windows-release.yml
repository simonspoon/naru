name: Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.12"

      - name: Build frontend
        run: |
          npm --prefix frontend ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix frontend run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        run: cargo build --release --bin naru

      - name: Smoke test
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'target\release\naru.exe'

          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "naru --version exited $LASTEXITCODE" }

          $env:NARU_DB = Join-Path $env:RUNNER_TEMP 't.db'
          & $exe project list
          if ($LASTEXITCODE -ne 0) { throw "naru project list exited $LASTEXITCODE" }

          $proc = Start-Process -FilePath $exe -ArgumentList 'serve', '--port', '7799' -PassThru -WindowStyle Hidden
          try {
            $resp = $null
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $resp = Invoke-WebRequest -Uri 'http://127.0.0.1:7799/' -UseBasicParsing -TimeoutSec 5
                if ($resp.StatusCode -eq 200) { break }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $resp -or $resp.StatusCode -ne 200) { throw 'serve did not answer 200 on /' }
            if ($resp.Content -notmatch 'id="root"') { throw 'served page has no root element' }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

          # The static CRT must be linked in: no VCRUNTIME140 dependency.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products '*' -property installationPath
          $dumpbin = Get-ChildItem -Path (Join-Path $vsPath 'VC\Tools\MSVC') -Recurse -Filter dumpbin.exe |
            Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe not found' }
          $deps = & $dumpbin.FullName /dependents $exe | Out-String
          Write-Host $deps
          if ($deps -match 'VCRUNTIME140') { throw 'naru.exe depends on VCRUNTIME140' }

      - name: Build installer
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME.StartsWith('v')) {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $version = '0.0.0-dev'
          }

          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup 6 not found at $iscc" }

          $dist = Join-Path $PWD 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $exe = Join-Path $PWD 'target\release\naru.exe'

          & $iscc "/DAppVersion=$version" "/DSourceExe=$exe" "/O$dist" 'packaging\windows\naru.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited $LASTEXITCODE" }

          $name = 'naru-windows-amd64-setup.exe'
          $setup = Join-Path $dist $name
          if (-not (Test-Path $setup)) { throw "$name was not produced" }
          $hash = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLower()
          [System.IO.File]::WriteAllText("$setup.sha256", "$hash  $name`n")

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: naru-windows-amd64
          path: dist

      - name: Attach to release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # release.yml's release job creates the release; wait for it.
          $found = $false
          for ($i = 0; $i -lt 90; $i++) {
            gh release view $env:GITHUB_REF_NAME *> $null
            if ($LASTEXITCODE -eq 0) { $found = $true; break }
            Start-Sleep -Seconds 20
          }
          if (-not $found) { throw "release $env:GITHUB_REF_NAME did not appear within 30 minutes" }
          gh release upload $env:GITHUB_REF_NAME (Get-ChildItem dist | ForEach-Object { $_.FullName }) --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
