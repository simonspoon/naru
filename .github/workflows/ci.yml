name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # rust-embed's macro requires frontend/dist to exist at compile time
      # (see scripts/build.sh); an empty stand-in is enough for check/test/clippy.
      - name: Stub frontend/dist
        run: mkdir -p frontend/dist

      - name: Check
        run: cargo check --all-targets

      - name: Test
        run: cargo test --all-targets

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          # 22.13, not 22.12: jsdom (the vitest environment) declares
          # engines ^20.19 || ^22.13 || >=24, one patch line above vite's floor.
          node-version: "22.13"
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run test
      - run: npm --prefix frontend run build

  # Compile-only: the library and binary build for Windows (naru task 1741).
  # Tests stay unix-only; a runtime port is a separate piece of work.
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Stub frontend/dist
        run: New-Item -ItemType Directory -Force frontend/dist
      - name: Build
        run: cargo build
      - name: Clippy
        run: cargo clippy -- -D warnings
