[package]
name = "naru"
version = "1.13.0"
edition = "2024"
description = "Local-first workspace where you and your Claude Code agents plan, run and talk through work"
license = "MIT"
repository = "https://github.com/simonspoon/naru"
keywords = ["task-management", "cli", "agent", "sqlite"]
categories = ["command-line-utilities"]

# The binary is `naru` (mesa task 1301). `mesa` is the same program under its
# old name, a real second binary so every script and agent that runs `mesa`
# keeps working. The crate is `naru` since mesa task 1302.
[[bin]]
name = "naru"
path = "src/main.rs"

[[bin]]
name = "mesa"
path = "src/bin/mesa.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
axum-embed = "0.1"
base64 = "0.22"
clap = { version = "4.6.1", features = ["derive"] }
directories = "6.0.0"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
portable-pty = "0.9"
rusqlite = { version = "0.40.1", features = ["bundled"] }
rust-embed = "8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "time"] }
tokio-stream = "0.1"
tokio-tungstenite = "0.29"
ts-rs = "12.0.1"
ureq = { version = "3.4.2", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
